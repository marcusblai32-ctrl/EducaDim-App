<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F2A3D"><title>EducaDim | Prototype UI/UX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
:root{--red:#D93A3A;--blue:#176B91;--tq:#45B7C7;--navy:#0F2A3D;--bg:#F2F7F9;--surface:#fff;--ink:#152F40;--muted:#637786;--line:#E2EAEE;--good:#16845B;--shadow:0 12px 34px rgba(15,42,61,.08);font-family:'DM Sans',sans-serif;color:var(--ink);background:#e9eff2;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1160px,100%);display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;align-items:start}.side{padding:22px 10px}.brand{font:800 25px Manrope;color:var(--navy);letter-spacing:-1px}.brand span{color:var(--red)}.side p{color:var(--muted);font-size:13px;line-height:1.6;margin:7px 0 25px}.navlink{width:100%;border:0;background:transparent;color:var(--muted);padding:13px 14px;border-radius:13px;text-align:left;font-weight:700;margin:3px 0;display:flex;gap:12px;align-items:center}.navlink.active{background:var(--navy);color:white}.sidefoot{margin-top:30px;padding:14px;border:1px solid var(--line);border-radius:15px;font-size:12px;color:var(--muted);line-height:1.5}.device{background:var(--surface);border-radius:28px;min-height:min(850px,calc(100vh - 48px));box-shadow:0 25px 80px rgba(15,42,61,.17);overflow:hidden;position:relative}.top{height:70px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--surface)}.top .brand{font-size:20px}.topright{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:#FBE6E6;color:var(--red);display:grid;place-items:center;font-weight:800}.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}.content{padding:26px 28px 36px;min-height:700px;background:var(--bg)}.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;color:var(--blue)}h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-.5px}h1{font-size:30px;line-height:1.15;margin:7px 0 9px}h2{font-size:21px;margin:0}h3{font-size:16px;margin:0}.muted{color:var(--muted)}.small{font-size:13px;line-height:1.5}.hero{border-radius:22px;background:linear-gradient(120deg,var(--navy),#174d69);color:#fff;padding:28px;display:grid;grid-template-columns:1.4fr .6fr;align-items:center;gap:20px;overflow:hidden;position:relative}.hero:after{content:'';position:absolute;width:250px;height:250px;border:1px solid rgba(69,183,199,.25);border-radius:50%;right:-70px;top:-110px;box-shadow:0 0 0 35px rgba(69,183,199,.06),0 0 0 75px rgba(69,183,199,.04)}.hero h1{max-width:480px}.hero p{color:#d3e2e9;max-width:470px;line-height:1.6}.hero .cta{position:relative;z-index:1}.heroart{position:relative;z-index:1;display:grid;place-items:center}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 28px}.stat,.panel,.course,.lessonrow{background:var(--surface);border:1px solid var(--line);border-radius:17px}.stat{padding:16px}.stat strong{display:block;font:800 25px Manrope;margin:8px 0 2px}.stat span{font-size:12px;color:var(--muted)}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:25px 0 13px}.textbtn{border:0;background:none;color:var(--blue);font-weight:800;padding:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.course{overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s}.course:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.art{height:132px;padding:18px;display:flex;align-items:flex-end;justify-content:space-between;color:#fff;background:linear-gradient(135deg,#0F2A3D,#176B91);position:relative;overflow:hidden}.art:after{content:'';position:absolute;width:130px;height:130px;border:1px solid rgba(255,255,255,.22);border-radius:50%;right:-22px;top:-55px;box-shadow:0 0 0 20px rgba(255,255,255,.05)}.art .symbol{font:800 42px Manrope;position:relative;z-index:1}.art .category{position:relative;z-index:1;background:rgba(255,255,255,.15);padding:6px 9px;border-radius:20px;font-size:11px}.coursebody{padding:15px}.coursebody h3{line-height:1.35;min-height:42px}.meta{display:flex;gap:12px;color:var(--muted);font-size:12px;margin:8px 0 13px}.progress{height:7px;background:#e8eef1;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--red);border-radius:20px}.progresslabel{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:30px;background:#e5f2f6;color:var(--blue);font-size:11px;font-weight:800}.primary,.secondary{border:0;border-radius:12px;padding:12px 17px;font-weight:800;min-height:44px}.primary{background:var(--red);color:#fff;box-shadow:0 7px 16px rgba(217,58,58,.18)}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.primary:hover{background:#c92f2f}.searchbar{display:flex;gap:10px;margin:18px 0}.searchbar input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;outline:0}.searchbar input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,107,145,.12)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filter{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 13px;border-radius:30px;font-size:12px;font-weight:700}.filter.active{background:var(--navy);border-color:var(--navy);color:white}.detailhero{border-radius:20px;overflow:hidden;background:var(--navy);color:#fff;padding:28px;display:flex;justify-content:space-between;align-items:center;gap:20px}.detailhero h1{max-width:580px}.detailhero p{color:#d6e4eb}.detailcols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,.8fr);gap:16px;margin-top:17px}.panel{padding:19px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 16px}.tab{border:0;background:none;padding:10px 13px;color:var(--muted);font-weight:800;border-bottom:2px solid transparent}.tab.active{color:var(--red);border-color:var(--red)}.lessonrow{display:flex;align-items:center;gap:12px;padding:13px;margin:9px 0;cursor:pointer}.lessonrow:hover{border-color:#b8d2dd}.lessonicon{width:37px;height:37px;border-radius:11px;background:#e7f2f5;color:var(--blue);display:grid;place-items:center;font-weight:800}.lessonrow .grow{flex:1}.lessonrow small{display:block;color:var(--muted);margin-top:4px}.video{aspect-ratio:16/9;background:radial-gradient(circle at 70% 25%,#1c5875,#0F2A3D 65%);border-radius:17px;display:grid;place-items:center;color:#fff;margin:14px 0}.play{width:66px;height:66px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:23px}.quizopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;margin:9px 0}.quizopt.selected{border-color:var(--blue);background:#edf6f8}.quizopt.correct{border-color:var(--good);background:#edf8f2}.quizopt.wrong{border-color:var(--red);background:#fff1f1}.notice{padding:13px 15px;border-radius:12px;background:#fff5e6;color:#875315;font-size:12px;line-height:1.5;margin-top:18px}.profilehead{background:var(--navy);color:white;border-radius:18px;padding:22px;display:flex;align-items:center;gap:16px}.profilehead .avatar{width:58px;height:58px;background:#fff;color:var(--red);font-size:20px}.setting{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.switch{accent-color:var(--red);width:19px;height:19px}.empty{padding:35px;text-align:center;color:var(--muted)}.footer{font-size:11px;color:var(--muted);padding:13px 28px;border-top:1px solid var(--line);background:var(--surface)}.download-shortcut{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border:1px solid var(--line);border-radius:15px;background:var(--surface);margin:16px 0;cursor:pointer}.download-shortcut b{display:block}.download-shortcut small{display:block;color:var(--muted);margin-top:4px}.download-shortcut span{font-size:26px;color:var(--blue)}.resourcebox{border:1px solid var(--line);border-radius:15px;padding:15px;margin-top:20px;background:var(--bg)}.resource-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.resource-row:last-of-type{border-bottom:0}.resource-row .grow{flex:1;min-width:0}.resource-row small{display:block;color:var(--muted);margin-top:4px}.compact{padding:8px 10px;min-height:36px;font-size:11px;white-space:nowrap}.download-summary{display:flex;justify-content:space-between;align-items:center;padding:20px;border-radius:18px;background:linear-gradient(120deg,var(--navy),#174d69);color:white}.download-summary h2{font-size:25px;margin:7px 0}.download-summary p{color:#d3e2e9}.download-big{font-size:45px;color:#83dce5}.resource-row .iconbtn{flex:0 0 36px;width:36px;height:36px}.mobilebar{display:none}
:root[data-theme="dark"]{--bg:#101a22;--surface:#172631;--ink:#e8f0f4;--muted:#a6b7c1;--line:#2c414e;--shadow:0 12px 34px rgba(0,0,0,.25);color-scheme:dark} [data-theme="dark"] body{background:#0b141b}[data-theme="dark"] .secondary,[data-theme="dark"] .filter,[data-theme="dark"] .searchbar input,[data-theme="dark"] .quizopt{background:#1c303d;color:var(--ink)}[data-theme="dark"] .progress{background:#30434e}[data-theme="dark"] .pill{background:#213d4a;color:#9ddbe4}
@media(max-width:850px){body{display:block;padding:0;background:var(--bg)}.shell{display:block;width:100%}.side{display:none}.device{min-height:100vh;border-radius:0;box-shadow:none}.top{height:62px;padding:0 18px}.content{padding:20px 17px 100px;min-height:calc(100vh - 62px)}.mobilebar{display:flex;position:fixed;z-index:10;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));justify-content:space-around}.mobilebar button{border:0;background:none;color:var(--muted);font-size:10px;font-weight:700;display:grid;gap:3px;justify-items:center}.mobilebar button.active{color:var(--red)}.detailcols{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.heroart{display:none}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.statrow{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.hero{padding:22px}.hero h1{font-size:26px}.detailhero{padding:21px}.content{padding-left:14px;padding-right:14px}.topright .hide-sm{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.flash-wrap{max-width:680px;margin:24px auto}.flash-count{text-align:center;font-size:12px;letter-spacing:1.5px;font-weight:800;color:var(--muted);margin-bottom:12px}.flash-card{width:100%;min-height:280px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,var(--navy),#18516c);color:white;padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;cursor:pointer;box-shadow:0 15px 40px #0f2a3d18}.flash-card strong{font:700 25px Manrope;line-height:1.45}.flash-card small{color:#c5dce5}.flash-card.revealed{background:linear-gradient(145deg,#176b91,#248c9c)}.flash-actions{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.course-pack{padding:16px 0;border-bottom:1px solid var(--line)}.course-pack:last-child{border-bottom:0}.pack-head{display:flex;align-items:center;gap:12px}.pack-head small{display:block;color:var(--muted);margin-top:5px}.course-pack details{margin:12px 0 8px 48px}.course-pack summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:13px}.pack-items{padding-left:18px;color:var(--muted);font-size:12px}.pack-items li{padding:5px 0}.pack-items li span{margin-left:8px}.pack-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-left:48px}

</style></head>
<body><div class="shell"><aside class="side"><div class="brand">Educa<span>Dim</span></div><p>Votre espace d’apprentissage<br>par Dimension Production</p><div id="sidenav"></div><div class="sidefoot">Prototype UI/UX interactif<br>Contenu fictif. Aucune connexion au backend n’est effectuée.</div></aside>
<main class="device"><header class="top"><div class="brand">Educa<span>Dim</span></div><div class="topright"><button class="iconbtn" title="Changer le thème" onclick="toggleTheme()">◐</button><button class="iconbtn hide-sm" title="Notifications" onclick="navigate('notifications')">♧</button><div class="avatar">MD</div></div></header><section class="content" id="view"></section><div class="mobilebar" id="mobilebar"></div><footer class="footer">EducaDim · Prototype de conception · Données de démonstration</footer></main></div>
<script>
const courses=[
{id:1,title:'Théorie musicale : les bases',category:'Musique',level:'Débutant',duration:'6 h',price:'Gratuit',progress:62,joined:true,symbol:'♫',description:'Découvrez les éléments essentiels de la musique, lisez les premières notes et développez votre écoute grâce à des activités progressives.'},
{id:2,title:'Excel pour le quotidien professionnel',category:'Technologies',level:'Débutant',duration:'8 h',price:'Gratuit',progress:25,joined:true,symbol:'▦',description:'Apprenez à organiser des données, utiliser les formules courantes et créer des tableaux clairs dans Excel.'},
{id:3,title:'Expression écrite en français',category:'Langues',level:'Intermédiaire',duration:'5 h',price:'12 USD',progress:0,joined:false,symbol:'Aa',description:'Améliorez la structure de vos textes, la grammaire et la rédaction de messages professionnels.'},
{id:4,title:'Communiquer avec assurance',category:'Développement',level:'Avancé',duration:'4 h',price:'25 USD',progress:0,joined:false,symbol:'↗',description:'Développez des méthodes de communication claires pour les échanges professionnels et les présentations.'},
{id:5,title:'Initiation au piano',category:'Musique',level:'Débutant',duration:'10 h',price:'20 USD',progress:30,joined:true,symbol:'♬',description:'Familiarisez-vous avec le clavier, le rythme et les premiers accords.'},
{id:6,title:'Les bases du développement web',category:'Technologies',level:'Intermédiaire',duration:'12 h',price:'30 USD',progress:0,joined:false,symbol:'</>',description:'Comprenez les bases du HTML, du CSS et de la logique des interfaces web.'}
];
const lessons=[['Bienvenue et objectifs','4 min','Vidéo'],['Les notions essentielles','12 min','Vidéo'],['Quiz : vérifier vos acquis','8 min','Quiz'],['Exercice guidé','15 min','Vidéo'],['Fiche de synthèse','PDF','Document'],['Évaluation finale','20 min','Quiz']];
const nav=[['home','Accueil','⌂'],['explore','Explorer','⌕'],['mycourses','Mes cours','▤'],['notifications','Alertes','♧'],['profile','Profil','◉']];
let state={page:'home',courseId:1,tab:'programme',query:'',category:'Tout',lesson:0,quizAnswer:-1,quizSubmitted:false,theme:'light',completed:{},downloads:[],flashIndex:0,flashRevealed:false,notice:''};
function persist(){try{localStorage.setItem('educadim-prototype-state',JSON.stringify({completed:state.completed,downloads:state.downloads,theme:state.theme}))}catch(e){}}
try{const saved=JSON.parse(localStorage.getItem('educadim-prototype-state')||'{}');state.completed=saved.completed||{};state.downloads=saved.downloads||[];state.theme=saved.theme||'light'}catch(e){}
document.documentElement.dataset.theme=state.theme;
function navigate(page,extra={}){state.page=page;Object.assign(state,extra);render();window.scrollTo({top:0,behavior:'smooth'})}
function notify(msg){state.notice=msg;render();setTimeout(()=>{state.notice='';const n=document.querySelector('.notice-toast');if(n)n.remove()},2400)}
function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';document.documentElement.dataset.theme=state.theme;persist();render()}
function activeCourses(){return courses.filter(c=>c.joined)}
function completedCount(){return Object.values(state.completed).filter(Boolean).length}
function progress(c){const total=lessons.length,done=lessons.filter((_,i)=>state.completed[c.id+'-'+i]).length;return c.joined?Math.max(c.progress,Math.round(done/total*100)):0}
function art(c){return `<div class="art"><span class="symbol">${c.symbol}</span><span class="category">${c.category}</span></div>`}
function courseCard(c){const p=progress(c);return `<article class="course" onclick="navigate('course',{courseId:${c.id},tab:'programme'})">${art(c)}<div class="coursebody"><span class="pill">${c.level}</span><h3 style="margin-top:9px">${c.title}</h3><div class="meta"><span>${c.duration}</span><span>${c.joined?'Inscrit':c.price}</span></div>${c.joined?`<div class="progress"><i style="width:${p}%"></i></div><div class="progresslabel"><span>Progression</span><b>${p}%</b></div>`:`<span class="small" style="color:var(--blue);font-weight:800">Voir la formation →</span>`}</div></article>`}
function shellTitle(kicker,title,desc=''){return `<div class="eyebrow">${kicker}</div><h1>${title}</h1>${desc?`<p class="muted" style="margin:0 0 20px;line-height:1.6">${desc}</p>`:''}`}
function loginPage(){return `<div style="max-width:520px;margin:35px auto"><div class="panel" style="padding:30px"><div class="brand" style="margin-bottom:24px">Educa<span>Dim</span></div>${shellTitle('BON RETOUR','Connectez-vous','Accédez à vos formations et reprenez votre apprentissage.')}<form onsubmit="event.preventDefault();navigate('home');notify('Connexion de démonstration uniquement. Aucun compte réel n’a été vérifié.')"><label class="small" for="email">Adresse e-mail</label><input id="email" type="email" required placeholder="vous@exemple.com" style="display:block;width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:7px 0 16px;background:var(--surface);color:var(--ink)"><label class="small" for="password">Mot de passe</label><input id="password" type="password" required placeholder="Votre mot de passe" style="display:block;width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:7px 0 17px;background:var(--surface);color:var(--ink)"><button class="primary" style="width:100%">Se connecter</button></form><button class="textbtn" style="margin-top:12px" onclick="navigate('register')">Créer un compte</button><div class="notice">Écran de conception. La connexion réelle utilisera POST /api/v1/auth/login/ et les jetons JWT du backend Django.</div></div></div>`}
function registerPage(){return `<div style="max-width:520px;margin:35px auto"><div class="panel" style="padding:30px"><div class="brand" style="margin-bottom:24px">Educa<span>Dim</span></div>${shellTitle('NOUVEAU COMPTE','Rejoignez EducaDim','Créez votre espace pour suivre vos formations.')}<form onsubmit="event.preventDefault();notify('Inscription de démonstration. Le formulaire réel sera relié à Django.')"><label class="small">Nom complet</label><input required placeholder="Votre nom" style="display:block;width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:7px 0 14px;background:var(--surface);color:var(--ink)"><label class="small">Adresse e-mail</label><input required type="email" placeholder="vous@exemple.com" style="display:block;width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:7px 0 14px;background:var(--surface);color:var(--ink)"><label class="small">Mot de passe</label><input required type="password" minlength="8" placeholder="8 caractères minimum" style="display:block;width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:7px 0 17px;background:var(--surface);color:var(--ink)"><button class="primary" style="width:100%">Créer mon compte</button></form><button class="textbtn" onclick="navigate('login')">J’ai déjà un compte</button><div class="notice">Les champs et validations sont visuels. Aucun compte n’est créé.</div></div></div>`}
function home(){const mine=activeCourses(),avg=Math.round(mine.reduce((a,c)=>a+progress(c),0)/Math.max(1,mine.length));return `${`<div class="hero"><div><div class="eyebrow" style="color:#83dce5">VOTRE ESPACE D’APPRENTISSAGE</div><h1>Bonjour Marie, prête à apprendre ?</h1><p>Reprenez votre parcours là où vous l’avez laissé et avancez à votre rythme.</p><button class="primary cta" onclick="navigate('mycourses')">Reprendre mes cours&nbsp; →</button></div><div class="heroart"><div style="width:150px;height:150px;border:1px solid #45B7C7;border-radius:50%;display:grid;place-items:center;font:800 70px Manrope;color:#45B7C7;background:#ffffff0b">Ed</div></div></div>`}<div class="statrow"><div class="stat"><span>FORMATIONS SUIVIES</span><strong>${mine.length}</strong><span>Dans votre espace</span></div><div class="stat"><span>LEÇONS TERMINÉES</span><strong>${completedCount()}</strong><span>Sur ${mine.length*lessons.length} leçons</span></div><div class="stat"><span>PROGRESSION MOYENNE</span><strong>${avg}%</strong><span>Tous vos cours</span></div></div><div class="sectionhead"><h2>Reprendre l’apprentissage</h2><button class="textbtn" onclick="navigate('mycourses')">Tout voir →</button></div><div class="grid">${mine.slice(0,2).map(courseCard).join('')}</div><div class="sectionhead"><h2>Explorer le catalogue</h2><button class="textbtn" onclick="navigate('explore')">Découvrir →</button></div><div class="grid">${courses.filter(c=>!c.joined).slice(0,2).map(courseCard).join('')}</div>`}
function explore(){const cats=['Tout',...new Set(courses.map(c=>c.category))];const filtered=courses.filter(c=>(state.category==='Tout'||c.category===state.category)&&c.title.toLowerCase().includes(state.query.toLowerCase()));return `${shellTitle('CATALOGUE','Trouvez votre prochaine formation','Parcourez les cours disponibles et choisissez un parcours adapté à vos objectifs.')}<div class="searchbar"><input aria-label="Rechercher une formation" placeholder="Rechercher un cours ou un sujet…" value="${escapeHtml(state.query)}" oninput="state.query=this.value;document.getElementById('results').innerHTML=courseResults()"><button class="secondary" onclick="state.query='';render()">Effacer</button></div><div class="filters">${cats.map(c=>`<button class="filter ${state.category===c?'active':''}" onclick="state.category='${c}';render()">${c}</button>`).join('')}</div><div id="results">${courseResults()}</div>`}
function courseResults(){const f=courses.filter(c=>(state.category==='Tout'||c.category===state.category)&&c.title.toLowerCase().includes(state.query.toLowerCase()));return `<p class="small muted">${f.length} formation(s) trouvée(s)</p>${f.length?`<div class="grid">${f.map(courseCard).join('')}</div>`:'<div class="panel empty">Aucune formation ne correspond à votre recherche.</div>'}`}
function coursePage(){const c=courses.find(x=>x.id===state.courseId)||courses[0],p=progress(c);return `<div class="detailhero"><div><span class="pill">${c.category} · ${c.level}</span><h1>${c.title}</h1><p>${c.duration} de contenu pédagogique · ${lessons.length} leçons</p><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="primary" onclick="${c.joined?`navigate('lesson',{lesson:0})`:`enroll(${c.id})`}">${c.joined?'Commencer le cours':'S’inscrire à la formation'}</button><button class="secondary" onclick="downloadCourse(${c.id})">⇩ Télécharger toute la formation</button></div></div><div style="font:800 65px Manrope;color:#45B7C7">${c.symbol}</div></div><div class="detailcols"><section class="panel"><div class="tabs"><button class="tab ${state.tab==='programme'?'active':''}" onclick="state.tab='programme';render()">Programme</button><button class="tab ${state.tab==='description'?'active':''}" onclick="state.tab='description';render()">Présentation</button><button class="tab ${state.tab==='objectifs'?'active':''}" onclick="state.tab='objectifs';render()">Objectifs</button></div>${state.tab==='programme'?lessons.map((l,i)=>`<div class="lessonrow" onclick="${c.joined?`navigate('lesson',{lesson:${i}})`:`notify('Inscrivez-vous pour accéder aux leçons.')`}"><div class="lessonicon">${state.completed[c.id+'-'+i]?'✓':l[2]==='Quiz'?'?':l[2]==='Document'?'PDF':'▶'}</div><div class="grow"><b>${l[0]}</b><small>${l[2]} · ${l[1]}</small></div><span class="muted">${state.completed[c.id+'-'+i]?'Terminé':'›'}</span></div>`).join(''):state.tab==='description'?`<h3>À propos de cette formation</h3><p class="muted" style="line-height:1.8">${c.description}</p><p class="muted small">Les informations de durée, de prix et de formateur seront alimentées par l’API Django dans l’application finale.</p>`:`<h3>À la fin de cette formation, vous pourrez :</h3><ul class="muted" style="line-height:2"><li>Comprendre les notions essentielles.</li><li>Mettre en pratique les compétences acquises.</li><li>Vérifier vos connaissances avec des évaluations.</li><li>Suivre votre progression dans votre espace.</li></ul>`}</section><aside class="panel"><div class="eyebrow">VOTRE PROGRESSION</div><h2 style="margin:9px 0">${p}%</h2><div class="progress"><i style="width:${p}%"></i></div><p class="small muted">${lessons.filter((_,i)=>state.completed[c.id+'-'+i]).length} leçon(s) marquée(s) comme terminée(s)</p><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="setting"><span class="small muted">Niveau</span><b>${c.level}</b></div><div class="setting"><span class="small muted">Durée estimée</span><b>${c.duration}</b></div><div class="setting"><span class="small muted">Accès</span><b>${c.joined?'Inscrit':c.price}</b></div><div class="notice">Données de formation fictives pour la maquette. L’inscription réelle passera par le backend Django.</div></aside></div>`}
function enroll(id){const c=courses.find(x=>x.id===id);c.joined=true;notify('Inscription simulée pour la maquette.');navigate('course',{courseId:id,tab:'programme'})}
function lessonPage(){const c=courses.find(x=>x.id===state.courseId)||courses[0],l=lessons[state.lesson]||lessons[0],isQuiz=l[2]==='Quiz';const resources=[{id:`${c.id}-${state.lesson}-notes`,name:'Fiche de cours',type:'PDF',size:'420 Ko'},{id:`${c.id}-${state.lesson}-audio`,name:'Audio de révision',type:'MP3',size:'3,2 Mo'}];const saved=resources.filter(r=>state.downloads.some(d=>d.id===r.id));return `${shellTitle('ESPACE DE FORMATION',c.title,l[0])}<div class="detailcols"><section class="panel"><div class="video">${isQuiz?'<div style="text-align:center"><div style="font-size:42px">?</div><b>Évaluation de connaissances</b></div>':'<button class="play" aria-label="Lecture de la vidéo" onclick="notify(\'Le lecteur vidéo sera connecté aux ressources du cours.\')">▶</button>'}</div><h2>${l[0]}</h2><p class="muted small">${l[2]} · ${l[1]} · Contenu de démonstration</p>${isQuiz?quizMarkup():`<p class="muted" style="line-height:1.8">Cette zone accueillera le contenu pédagogique réel : lecteur vidéo, texte de cours, fichiers joints et consignes. Les ressources ci-dessous illustrent le fonctionnement des téléchargements hors connexion.</p><div class="resourcebox"><div class="sectionhead" style="margin-top:0"><h3>Ressources de la leçon</h3><span class="pill">${saved.length}/${resources.length} enregistrée(s)</span></div>${resources.map(r=>`<div class="resource-row"><div class="lessonicon">${r.type==='PDF'?'PDF':'♫'}</div><div class="grow"><b>${r.name}</b><small>${r.type} · ${r.size}</small></div><button class="${state.downloads.some(d=>d.id===r.id)?'secondary':'primary'} compact" onclick="toggleDownload('${r.id}','${r.name}','${r.type}','${r.size}')">${state.downloads.some(d=>d.id===r.id)?'Enregistré ✓':'Garder hors ligne'}</button></div>`).join('')}<button class="textbtn" onclick="navigate('downloads')">Gérer mes téléchargements →</button><button class="secondary" style="margin-top:10px" onclick="navigate('flashcards')">Réviser avec les flashcards →</button></div><div class="notice">Mode démonstration : les fichiers enregistrés ici sont des fiches exemples. Dans l’application Flutter, les vrais PDF, audios et vidéos seront téléchargés depuis les ressources autorisées par Django.</div>`}<div style="display:flex;gap:9px;justify-content:space-between;margin-top:22px"><button class="secondary" onclick="navigate('course',{courseId:${c.id},tab:'programme'})">← Programme</button><button class="primary" onclick="markComplete()">${state.completed[c.id+'-'+state.lesson]?'Leçon terminée ✓':'Marquer comme terminée'}</button></div></section><aside class="panel"><div class="eyebrow">PLAN DU COURS</div><h3 style="margin:8px 0 14px">${lessons.length} leçons</h3>${lessons.map((x,i)=>`<div class="lessonrow" style="padding:9px;margin:5px 0;${i===state.lesson?'border-color:var(--blue);background:var(--bg)':''}" onclick="navigate('lesson',{lesson:${i}})"><div class="lessonicon">${state.completed[c.id+'-'+i]?'✓':i+1}</div><div class="grow"><b style="font-size:12px">${x[0]}</b><small>${x[2]} · ${x[1]}</small></div></div>`).join('')}</aside></div>`}
function toggleDownload(id,name,type,size){const i=state.downloads.findIndex(d=>d.id===id);if(i>=0){state.downloads.splice(i,1);persist();notify('Ressource retirée de vos téléchargements.');return}state.downloads.push({id,name,type,size});persist();notify('Ressource ajoutée à votre espace hors connexion.')}
function downloadCourse(courseId){
 const c=courses.find(x=>x.id===courseId)||courses[0];
 if(!c.joined){notify("Inscrivez-vous à cette formation avant de la télécharger.");return}
 const packId='course-'+c.id;
 const existing=state.downloads.find(d=>d.id===packId);
 if(existing){notify("Cette formation est déjà dans votre espace hors connexion.");navigate('downloads');return}
 const items=[
  {type:'Cours',name:'Présentation et objectifs'},
  ...lessons.map((l,i)=>({type:l[2],name:l[0],lesson:i})),
  ...lessons.filter(l=>l[2]==='Quiz').map(l=>({type:'Quiz associé',name:l[0]})),
  {type:'Flashcards',name:'Cartes de révision'},
  {type:'Ressources',name:'Documents, audios et médias autorisés'}
 ];
 state.downloads.push({id:packId,kind:'course',courseId:c.id,name:c.title,type:'Formation complète',size:`${items.length} éléments`,items,status:'saved',addedAt:new Date().toISOString()});
 persist();notify("Formation ajoutée à votre espace hors connexion.");navigate('downloads');
}
function flashcards(){
 const cards=[
  {q:'Qu’est-ce qu’un objectif d’apprentissage ?',a:'Un résultat précis que l’apprenant doit pouvoir démontrer après une activité ou une leçon.'},
  {q:'Pourquoi faut-il réviser régulièrement ?',a:'La répétition espacée aide à consolider les connaissances et à mieux les retenir.'},
  {q:'À quoi sert une évaluation formative ?',a:'À vérifier la compréhension pendant l’apprentissage et à identifier les points à améliorer.'},
  {q:'Que doit contenir une bonne fiche de synthèse ?',a:'Les idées principales, les définitions importantes et les points à mémoriser.'}
 ];
 const card=cards[state.flashIndex%cards.length];
 return `${shellTitle('MÉMORISATION ACTIVE','Flashcards','Révisez les notions clés de cette formation avec des cartes question-réponse.')}<div class="flash-wrap"><div class="flash-count">CARTE ${state.flashIndex+1} / ${cards.length}</div><button class="flash-card ${state.flashRevealed?'revealed':''}" onclick="state.flashRevealed=!state.flashRevealed;render()" aria-label="Retourner la carte"><span class="eyebrow">${state.flashRevealed?'RÉPONSE':'QUESTION'}</span><strong>${escapeHtml(state.flashRevealed?card.a:card.q)}</strong><small>Toucher pour ${state.flashRevealed?'revoir la question':'afficher la réponse'}</small></button><div class="flash-actions"><button class="secondary" onclick="state.flashIndex=(state.flashIndex+${cards.length-1})%${cards.length};state.flashRevealed=false;render()">← Précédente</button><button class="primary" onclick="state.flashRevealed=false;state.flashIndex=(state.flashIndex+1)%${cards.length};render()">Suivante →</button></div><p class="small muted" style="text-align:center">Les cartes définitives seront générées à partir des notions et contenus réels du cours via Django.</p></div>`;
}
function downloads(){
 const packs=state.downloads.filter(d=>d.kind==='course'),files=state.downloads.filter(d=>d.kind!=='course');
 return `${shellTitle('VOTRE ESPACE HORS CONNEXION','Téléchargements','Téléchargez une formation entière pour retrouver son contenu sans connexion.')}<div class="download-summary"><div><span class="eyebrow">FORMATIONS DISPONIBLES HORS LIGNE</span><h2>${packs.length} formation(s)</h2><p class="small">Cours, modules, leçons, sections, quiz, flashcards et ressources associées.</p></div><div class="download-big">⇩</div></div><div class="sectionhead"><h2>Mes formations téléchargées</h2><span class="pill">${packs.length}</span></div>${packs.length?`<div class="panel">${packs.map(d=>`<div class="course-pack"><div class="pack-head"><div class="lessonicon">▤</div><div class="grow"><b>${escapeHtml(d.name)}</b><small>${escapeHtml(d.size)} · Enregistrée pour le mode hors connexion</small></div><span class="pill">Prête</span></div><details><summary>Voir le contenu inclus</summary><ul class="pack-items">${(d.items||[]).map(x=>`<li><b>${escapeHtml(x.type)}</b><span>${escapeHtml(x.name)}</span></li>`).join('')}</ul></details><div class="pack-actions"><button class="secondary compact" onclick="exportCourseManifest('${d.id}')">Exporter la liste du cours</button><button class="textbtn" onclick="removeDownload('${d.id}')">Supprimer la formation</button></div></div>`).join('')}</div>`:`<div class="panel empty"><div style="font-size:36px;color:var(--blue)">⇩</div><h3>Aucune formation téléchargée</h3><p class="small muted">Ouvrez une formation à laquelle vous êtes inscrit, puis choisissez « Télécharger toute la formation ».</p><button class="primary" onclick="navigate('mycourses')">Voir mes formations</button></div>`}<div class="sectionhead"><h2>Autres ressources</h2><span class="pill">${files.length}</span></div>${files.length?`<div class="panel">${files.map(d=>`<div class="resource-row"><div class="lessonicon">${d.type==='PDF'?'PDF':'♫'}</div><div class="grow"><b>${escapeHtml(d.name)}</b><small>${escapeHtml(d.type)} · ${escapeHtml(d.size)}</small></div><button class="textbtn" onclick="removeDownload('${d.id}')">Retirer</button></div>`).join('')}</div>`:`<p class="small muted">Aucune ressource individuelle enregistrée.</p>`}<div class="notice">Dans l’application finale, une formation téléchargée comprendra tout ce que l’API autorise : structure du cours, modules, sections, leçons, textes, vidéos ou audios téléchargeables, PDF, pièces jointes, quiz, questions, réponses et explications, flashcards et ressources liées. Les droits et limites fixés par Django seront respectés.</div>`;
}
function exportCourseManifest(id){
 const d=state.downloads.find(x=>x.id===id);if(!d)return;
 const blob=new Blob([JSON.stringify({course:d.name,offlineContents:d.items||[]},null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='educadim-course-content-list.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
 notify('Liste du contenu exportée.');
}
function removeDownload(id){state.downloads=state.downloads.filter(d=>d.id!==id);persist();render();}
function downloadSample(id){const d=state.downloads.find(x=>x.id===id);if(!d)return;const content=`EducaDim - Ressource de démonstration\n\n${d.name}\nType : ${d.type}\n\nCe fichier illustre le téléchargement depuis le prototype. Le contenu pédagogique réel sera fourni par EducaDim.`;const blob=new Blob([content],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`${d.name.replace(/[^a-z0-9-_]/gi,'_')}.txt`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);notify('Fichier exemple téléchargé.')}
function removeDownload(id){state.downloads=state.downloads.filter(d=>d.id!==id);persist();render()}
function clearDownloads(){state.downloads=[];persist();render();notify('Votre liste de téléchargements est vide.')}
function quizMarkup(){return `<h3 style="margin:17px 0 8px">Quelle affirmation décrit le mieux une bonne pratique d’apprentissage ?</h3>${['Avancer sans vérifier sa compréhension','Pratiquer régulièrement et vérifier ses acquis','Ignorer les exercices et les évaluations'].map((x,i)=>`<button class="quizopt ${state.quizSubmitted&&i===1?'correct':''} ${state.quizSubmitted&&state.quizAnswer===i&&i!==1?'wrong':''} ${state.quizAnswer===i?'selected':''}" onclick="if(!state.quizSubmitted){state.quizAnswer=${i};render()}">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}<button class="primary" style="margin-top:9px" ${state.quizAnswer<0||state.quizSubmitted?'disabled':''} onclick="state.quizSubmitted=true;render()">Vérifier ma réponse</button>${state.quizSubmitted?`<p class="small" style="color:${state.quizAnswer===1?'var(--good)':'var(--red)'};font-weight:800">${state.quizAnswer===1?'Bonne réponse.':'Réponse incorrecte. La bonne réponse est B.'}</p>`:''}`}
function markComplete(){state.completed[state.courseId+'-'+state.lesson]=true;persist();if(state.lesson<lessons.length-1){state.lesson++;notify('Leçon marquée comme terminée.')}else{notify('Vous avez terminé les leçons de démonstration.')}render()}
function mycourses(){const mine=activeCourses();return `${shellTitle('VOTRE APPRENTISSAGE','Mes formations','Retrouvez vos cours en cours et consultez votre progression.')}<div class="download-shortcut" onclick="navigate('downloads')"><div><b>Mes téléchargements</b><small>${state.downloads.length} ressource(s) disponible(s) hors connexion</small></div><span>⇩</span></div><div class="grid">${mine.map(courseCard).join('')}</div>${mine.length?'':'<div class="panel empty">Vous n’êtes inscrit à aucune formation.</div>'}`}
function notifications(){return `${shellTitle('CENTRE DE NOTIFICATIONS','Vos actualités','Les notifications de cette maquette sont des exemples visuels.')}<div class="panel">${[['Formation','Votre progression a été mise à jour.','Aujourd’hui'],['Nouveau cours','Une nouvelle formation pourrait vous intéresser.','Hier'],['Rappel','Pensez à reprendre votre apprentissage.','Cette semaine']].map((n,i)=>`<div class="lessonrow" style="cursor:default"><div class="lessonicon">${i===0?'✓':i===1?'＋':'◷'}</div><div class="grow"><b>${n[0]}</b><small>${n[1]}</small></div><small>${n[2]}</small></div>`).join('')}</div>`}
function profile(){return `${shellTitle('ESPACE PERSONNEL','Mon profil','Gérez vos préférences et consultez les informations de votre compte.')}<div class="profilehead"><div class="avatar">MD</div><div><h2 style="color:white">Marie Dorval</h2><div class="small" style="color:#d6e4eb">marie.dorval@exemple.com</div></div></div><div class="detailcols"><section class="panel"><h3>Informations personnelles</h3><div class="setting"><span class="muted">Nom complet</span><b>Marie Dorval</b></div><div class="setting"><span class="muted">Adresse e-mail</span><b>marie.dorval@exemple.com</b></div><div class="setting"><span class="muted">Formations suivies</span><b>${activeCourses().length}</b></div><div class="notice">Profil fictif. Les informations réelles seront chargées depuis /api/v1/me/.</div></section><section class="panel"><h3>Préférences</h3><div class="setting"><span>Mode sombre</span><input class="switch" type="checkbox" ${state.theme==='dark'?'checked':''} onchange="toggleTheme()"></div><div class="setting"><span>Langue de l’application</span><b>Français</b></div><div class="setting"><span>Notifications</span><b>Activées</b></div><button class="secondary" style="width:100%;margin-top:17px" onclick="notify('La gestion du compte sera reliée à Django.')">Paramètres du compte</button><button class="textbtn" style="width:100%;margin-top:12px" onclick="navigate('login')">Se déconnecter</button></section></div>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const pages={home,explore,course:coursePage,lesson:lessonPage,mycourses,downloads,flashcards,notifications,profile,login:loginPage,register:registerPage};document.getElementById('view').innerHTML=(pages[state.page]||home)()+(state.notice?`<div class="notice notice-toast" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);max-width:90vw;background:var(--navy);color:white;z-index:20">${escapeHtml(state.notice)}</div>`:'');document.getElementById('sidenav').innerHTML=nav.map(([id,label,icon])=>`<button class="navlink ${state.page===id?'active':''}" onclick="navigate('${id}')"><span style="font-size:19px;width:22px;text-align:center">${icon}</span>${label}</button>`).join('');document.getElementById('mobilebar').innerHTML=nav.map(([id,label,icon])=>`<button class="${state.page===id?'active':''}" onclick="navigate('${id}')"><span style="font-size:19px">${icon}</span>${label}</button>`).join('')}
render();
</script></body></html>
